<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0B1F3A">
    <title>Offline | Karwan E Al Saeed Travel & Tours</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: #14213d;
            background:
                radial-gradient(circle at top, #ffffff 0, #eef3f8 48%, #dfe8f1 100%);
            font-family: Arial, Helvetica, sans-serif;
        }

        main {
            width: min(100%, 560px);
            padding: 36px 28px;
            text-align: center;
            background: #ffffff;
            border: 1px solid rgba(11, 31, 58, 0.12);
            border-radius: 24px;
            box-shadow: 0 24px 70px rgba(11, 31, 58, 0.14);
        }

        img {
            width: 112px;
            height: 112px;
            object-fit: contain;
            margin-bottom: 18px;
            border-radius: 22px;
        }

        h1 {
            margin: 0 0 12px;
            color: #0b1f3a;
            font-size: clamp(1.7rem, 5vw, 2.4rem);
        }

        p {
            margin: 8px 0;
            line-height: 1.7;
            color: #526275;
        }

        .urdu {
            direction: rtl;
            font-family: "Noto Nastaliq Urdu", "Segoe UI", sans-serif;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            margin-top: 22px;
            padding: 12px 24px;
            color: #ffffff;
            background: #0b1f3a;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main>
        <img
            src="/images/pwa/icon-192x192.png"
            alt="Karwan E Al Saeed Travel & Tours"
        >

        <h1>You are offline</h1>

        <p>
            Please check your internet connection and try again.
        </p>

        <p class="urdu" lang="ur">
            آپ اس وقت آف لائن ہیں۔ براہِ کرم اپنا انٹرنیٹ کنکشن چیک کریں۔
        </p>

        <a href="/">
            Try Again · دوبارہ کوشش کریں
        </a>
    </main>
</body>
</html>
